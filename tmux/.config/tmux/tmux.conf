# ~/.config/tmux/tmux.conf  (managed in ~/dotfiles, linked by stow)
# tmux 3.5+ (Debian 13 ships 3.5a, Ubuntu 26.04 ships 3.6)
#
# Prefix is still the default Ctrl-b, and the default split keys (" and %)
# still work, so nothing here breaks muscle memory on a stock tmux box.

# ------------------------------------------------------------------ terminal

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard"
set -as terminal-features ",xterm-256color:RGB:clipboard"

# ------------------------------------------------------------------ behavior

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1              # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on       # close window 2 of 3 and 3 becomes 2
setw -g aggressive-resize on
set -g display-time 2000
set -g status-interval 5
set -g set-titles on
set -g set-titles-string "#H: #S / #W"
setw -g monitor-activity on      # flag windows with new output
set -g visual-activity off

# ------------------------------------------------------------------ clipboard
# Copies go to the Mac clipboard over SSH through OSC 52.
# Ghostty allows this by default (clipboard-write = allow).

set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
# Mouse: drag to select, release copies. Hold Shift to use Ghostty's own selection instead.

# ------------------------------------------------------------------ keybinds
#   prefix |      split side by side        prefix -      split top/bottom
#   prefix h/j/k/l  move between panes      prefix H/J/K/L  resize (repeatable)
#   prefix c      new window, same dir      prefix Tab    last window
#   prefix r      reload this file          prefix [      copy mode (v select, y copy)

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window             # `l` used to be last-window

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------------ Tokyo Night status bar
# Left block turns orange while the prefix is pressed, yellow in copy mode.

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#16161e,bold]#{?client_prefix,#[bg=#ff9e64],#{?pane_in_mode,#[bg=#e0af68],#[bg=#7aa2f7]}}  #S #[default] "
set -g status-right "#[fg=#bb9af7] #H #[fg=#565f89]| #[fg=#7dcfff] %a %b %d #[fg=#565f89]| #[fg=#7aa2f7,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#565f89] #I #W#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#292e42,bold] #I #W#{?window_zoomed_flag, ,} "
setw -g window-status-activity-style "fg=#e0af68"
setw -g window-status-bell-style     "fg=#f7768e,bold"

set -g pane-border-style        "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style            "bg=#292e42,fg=#7dcfff"
set -g message-command-style    "bg=#292e42,fg=#7dcfff"
setw -g mode-style              "bg=#283457,fg=#c0caf5"
setw -g clock-mode-colour       "#7aa2f7"

# ------------------------------------------------------------------ plugins (TPM)
# Session persistence:
#   tmux-resurrect  prefix Ctrl-s saves, prefix Ctrl-r restores
#   tmux-continuum  saves every 15 min, restores automatically when tmux starts
# TPM installs itself on first launch (needs git + network).
# Add a plugin: add a @plugin line, then prefix I.  Update: prefix U.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
if-shell "test ! -d $HOME/.config/tmux/plugins/tpm" {
  run-shell "git clone --depth 1 https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm"
  run-shell "$HOME/.config/tmux/plugins/tpm/bin/install_plugins"
}

# Must stay the last line
run-shell "$HOME/.config/tmux/plugins/tpm/tpm"
